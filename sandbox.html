<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>OpenBrowser Sandbox</title>
  <script>
    window.addEventListener('message', async (event) => {
      if (!event.data || event.data.type !== 'execute') return;

      const { code, id } = event.data;
      let result, error;

      try {
        const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
        const fn = new AsyncFunction(code);
        result = await fn();
        if (result === undefined) result = null;
        result = JSON.stringify(result, null, 2);
      } catch (e) {
        error = e.message;
      }

      // FIX: event.origin can be an empty string (falsy) for blob: or file: origins,
      // which would cause `event.origin || '*'` to fall back to '*', posting to any
      // origin. Use a ternary to explicitly handle the empty-string case.
      const targetOrigin = event.origin !== '' ? event.origin : '*';
      event.source.postMessage({ type: 'result', id, result, error }, targetOrigin);
    });
  </script>
</head>
<body></body>
</html>
